name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Widget selftest (every widget x variant x size)
        run: python -m hollyweeb --selftest --frames 6

      - name: Headless render smoke test
        run: python -m hollyweeb --shot shot.txt --size 120x36 --frames 90 -c neko

      - name: Headless render (256 colour + select screen)
        run: python -m hollyweeb --shot select.txt --size 100x30 --frames 40 --screen select --color 256

      - name: Console script works
        run: hollyweeb --list
