[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hollyweeb"
version = "1.6.0"
description = "A fashion-forward, cyberpunk, aggressively cute clone of hollywood for any terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hollyweeb contributors" }]
keywords = ["terminal", "tui", "cyberpunk", "kawaii", "hollywood", "screensaver", "ascii-art", "music", "chiptune", "synthwave", "audio"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Artistic Software",
  "Topic :: Terminals",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/m7pod/hollyweeb"
Repository = "https://github.com/m7pod/hollyweeb"
Issues = "https://github.com/m7pod/hollyweeb/issues"
Changelog = "https://github.com/m7pod/hollyweeb/releases"

[project.scripts]
hollyweeb = "hollyweeb.cli:main"

[tool.setuptools]
packages = ["hollyweeb"]
